asyncapi: 3.1.0
info:
  title: Priorisation Epic - session WebSocket
  version: 1.0.0
  description: |
    Design of the **only** channel for live session actions, aligned with planning-poker (AD-2):
    raw WebSocket carrying JSON text frames, no STOMP, no SockJS. Every message is an object
    whose `type` property names it. Operations are written from the webservice's point of view:
    it **receives** the client's intents and **sends** its own messages.

    Shared rules (as in planning-poker AD-4, extended):
    - An intent already satisfied changes nothing, does not increment `version`, raises no error.
    - A forbidden intent changes nothing and gets `error` back (`FORBIDDEN`, `SESSION_CLOSED`).
    - Intents that write a feature carry the feature `version` they read; a mismatch changes
      nothing and gets `error STALE_VERSION` (constitution III: no silent overwrite). The client
      already holds the current state from the last `sessionState`.
    - After every accepted intent, the server sends a fresh `sessionState` to **every**
      connection of the session, each one **filtered for its recipient** (FR-019, FR-019a,
      SC-004).
    - The contract only evolves by addition.
    - Exception, the **live ranking room** (FR-015b, FR-015c, added 2026-10-29): its intents
      (`updateRankingDraft`, `endRanking`, `reactToFeature`, `proposeMove`, `resolveProposal`,
      `updateHand`, `setSpotlight`, `openAgreementPoll`, `answerAgreementPoll`) write nothing
      to the database, do not increment `version` and do not trigger `sessionState`. After
      each accepted one, the server sends a fresh `rankingRoom` to every connection of the
      session, filtered for its recipient. The room lives in memory, one per session, from
      the first `updateRankingDraft` to `endRanking`; it is lost on a server restart, which
      only ends the room (the retained values are still written with `updateFeature`).
    - The contract never lists the criteria of a method (FR-017a, FR-017b). Criteria and computed
      values are maps keyed by the keys that `sessionState.methodDefinition` declares (for WSJF:
      criteria `bv`, `tc`, `rrOe`, `js`; computed values `cod`, `wsjf`). Adding a method adds
      no schema.

    This file is the design; it is transcribed into `contract/asyncapi.yaml` (source of truth)
    with payloads in `contract/schemas/` and examples in `contract/examples/`.
  license:
    name: Proprietary

defaultContentType: application/json

channels:
  session:
    address: /ws/sessions/{sessionId}
    title: Session channel
    description: |
      Handshake (as in planning-poker AD-7):
      1. the client opens `/ws/sessions/{sessionId}` (`wss://` derived from `apiBaseUrl`); tokens
         are **never** in the URL;
      2. its first message must be `hello`, within 5 s;
      3. the server checks the session (close `4404` if unknown), then the participant token
         (close `4401` if unknown), then the optional animation token (if present and invalid,
         the connection is accepted as a plain participant and gets `error FORBIDDEN`);
      4. then it sends `sessionState`.

      Liveness (as in planning-poker AD-8): protocol ping every 5 s, close after 15 s without pong
      nor message; server `tick` every 5 s; client `heartbeat` every 5 s (also keeps the Render
      host awake); the client declares the connection lost after 12 s of silence and reconnects
      immediately, then after 1, 2, 4, 8 s, then every 10 s. On `4401` or `4404` it does not
      reconnect.

      Error codes (`error.code`): `INVALID_MESSAGE`, `FORBIDDEN`, `SESSION_CLOSED`,
      `STALE_VERSION`, `INVALID_VALUE` (value outside the scale), `DUPLICATE_EXTERNAL_ID`,
      `FEATURE_IN_OPEN_ROUND` (`updateFeature` changing criteria / `deleteFeature` on a
      feature in an open round),
      `ROUND_REVEALED`, `SCALE_IMPACT` (with `impactedValues`),
      `UNKNOWN_PARTICIPANT`, `UNKNOWN_CRITERION` (a criterion key the session's method does
      not declare), `SESSION_NOT_STARTED` (`openRound` or `changeStatus CLOSE` while in PREPARATION),
      `ROUND_OPEN` (`openRound`, `changeStatus CLOSE` or a scale change in `updateSettings`
      while a round is open: only one open round per session in V1), `PARTICIPANT_OFFLINE`
      (`transferFacilitator` to a participant with no open connection), `SESSION_NAME_TAKEN`
      (`updateSettings` renaming the session to the name of another session, FR-001a),
      `NO_RANKING_IN_PROGRESS` (a ranking room intent other than `updateRankingDraft` while
      no room is open), `NOT_IN_RANKING` (a feature or criterion outside the current draft,
      a reference feature that is not ranked, or a proposal or poll that is unknown, already
      resolved or replaced).

      Live ranking room (FR-015b, FR-015c):
      - the facilitator's first `updateRankingDraft` opens the room; every member then gets
        `rankingRoom` with `active: true`. A connection that opens (or reopens) while a room is
        open gets `rankingRoom` right after `sessionState`;
      - the room ends on `endRanking` (`SAVED` once the server confirmed every `updateFeature`,
        or `CANCELLED`), when the facilitator's last connection closes (`FACILITATOR_LEFT`), on
        `transferFacilitator` (`FACILITATOR_CHANGED`) or on `changeStatus CLOSE`
        (`SESSION_CLOSED`). Every member then gets one last `rankingRoom` with `active: false`
        and `endReason`, and goes back to the board;
      - the facilitator's client sends a full snapshot of its draft, at most once every 200 ms
        (latest state only); the server forwards the latest snapshot it holds;
      - reactions, proposals, hands, spotlight, poll and feed are dropped with the room: never
        stored, exported nor written to the change log (FR-025);
      - phones are read-only in V1: the front sends none of these intents from a phone; the
        server does not tell devices apart.
    parameters:
      sessionId:
        description: 128 random bits, base64url without padding (22 characters).
    messages:
      hello: { $ref: '#/components/messages/hello' }
      heartbeat: { $ref: '#/components/messages/heartbeat' }
      addFeature: { $ref: '#/components/messages/addFeature' }
      updateFeature: { $ref: '#/components/messages/updateFeature' }
      deleteFeature: { $ref: '#/components/messages/deleteFeature' }
      updateSettings: { $ref: '#/components/messages/updateSettings' }
      changeStatus: { $ref: '#/components/messages/changeStatus' }
      openRound: { $ref: '#/components/messages/openRound' }
      castVote: { $ref: '#/components/messages/castVote' }
      revealRound: { $ref: '#/components/messages/revealRound' }
      transferFacilitator: { $ref: '#/components/messages/transferFacilitator' }
      updateRankingDraft: { $ref: '#/components/messages/updateRankingDraft' }
      endRanking: { $ref: '#/components/messages/endRanking' }
      reactToFeature: { $ref: '#/components/messages/reactToFeature' }
      proposeMove: { $ref: '#/components/messages/proposeMove' }
      resolveProposal: { $ref: '#/components/messages/resolveProposal' }
      updateHand: { $ref: '#/components/messages/updateHand' }
      setSpotlight: { $ref: '#/components/messages/setSpotlight' }
      openAgreementPoll: { $ref: '#/components/messages/openAgreementPoll' }
      answerAgreementPoll: { $ref: '#/components/messages/answerAgreementPoll' }
      rankingRoom: { $ref: '#/components/messages/rankingRoom' }
      sessionState: { $ref: '#/components/messages/sessionState' }
      facilitatorHandover: { $ref: '#/components/messages/facilitatorHandover' }
      tick: { $ref: '#/components/messages/tick' }
      error: { $ref: '#/components/messages/error' }
    x-close-codes:
      - code: 4401
        reason: Unknown participant token. The client shows the Join screen.
      - code: 4404
        reason: Unknown session. The client shows the "session not found" screen.
      - code: 1008
        reason: First message is not a valid hello, or hello did not arrive within 5 s.
      - code: 1009
        reason: Incoming message larger than the limit (16 KB by default). The client reconnects.

operations:
  receiveHello: { action: receive, channel: { $ref: '#/channels/session' }, messages: [{ $ref: '#/channels/session/messages/hello' }] }
  receiveHeartbeat: { action: receive, channel: { $ref: '#/channels/session' }, messages: [{ $ref: '#/channels/session/messages/heartbeat' }] }
  receiveAddFeature: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Add a feature (FR-006) - facilitator', messages: [{ $ref: '#/channels/session/messages/addFeature' }] }
  receiveUpdateFeature: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Edit a feature and its retained values (FR-006, FR-015, FR-021) - facilitator', messages: [{ $ref: '#/channels/session/messages/updateFeature' }] }
  receiveDeleteFeature: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Soft-delete a feature, traced - facilitator', messages: [{ $ref: '#/channels/session/messages/deleteFeature' }] }
  receiveUpdateSettings: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Rename or change the scale (FR-010, FR-011) - facilitator', messages: [{ $ref: '#/channels/session/messages/updateSettings' }] }
  receiveChangeStatus: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Start, close or reopen (FR-004) - facilitator', messages: [{ $ref: '#/channels/session/messages/changeStatus' }] }
  receiveOpenRound: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Open a masked round on selected features (FR-018, FR-022) - facilitator', messages: [{ $ref: '#/channels/session/messages/openRound' }] }
  receiveCastVote: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Send or replace own ranking for the round (FR-019)', messages: [{ $ref: '#/channels/session/messages/castVote' }] }
  receiveRevealRound: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Reveal the whole round (FR-020) - facilitator', messages: [{ $ref: '#/channels/session/messages/revealRound' }] }
  receiveTransferFacilitator: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Hand over the facilitator role (FR-002a) - facilitator', messages: [{ $ref: '#/channels/session/messages/transferFacilitator' }] }
  receiveUpdateRankingDraft: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Open the room or broadcast the ranking draft, or pause the broadcast (FR-015b) - facilitator', messages: [{ $ref: '#/channels/session/messages/updateRankingDraft' }] }
  receiveEndRanking: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Close the ranking room, saved or cancelled (FR-015b) - facilitator', messages: [{ $ref: '#/channels/session/messages/endRanking' }] }
  receiveReactToFeature: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Add or remove a reaction on a card (FR-015c point 1) - participant', messages: [{ $ref: '#/channels/session/messages/reactToFeature' }] }
  receiveProposeMove: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Propose a move to the facilitator (FR-015c point 2) - participant', messages: [{ $ref: '#/channels/session/messages/proposeMove' }] }
  receiveResolveProposal: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Apply, discuss or dismiss a proposal (FR-015c point 2) - facilitator', messages: [{ $ref: '#/channels/session/messages/resolveProposal' }] }
  receiveUpdateHand: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Raise or lower a hand, give or end the floor (FR-015c point 3)', messages: [{ $ref: '#/channels/session/messages/updateHand' }] }
  receiveSetSpotlight: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Start, extend or end the card under discussion (FR-015c point 4) - facilitator', messages: [{ $ref: '#/channels/session/messages/setSpotlight' }] }
  receiveOpenAgreementPoll: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Ask everyone whether they agree with the ranking of a criterion (FR-015c point 5) - facilitator', messages: [{ $ref: '#/channels/session/messages/openAgreementPoll' }] }
  receiveAnswerAgreementPoll: { action: receive, channel: { $ref: '#/channels/session' }, summary: 'Answer or change an answer to the agreement poll (FR-015c point 5) - participant', messages: [{ $ref: '#/channels/session/messages/answerAgreementPoll' }] }
  sendRankingRoom: { action: send, channel: { $ref: '#/channels/session' }, summary: 'Live ranking room, filtered per recipient (FR-015b, FR-015c)', messages: [{ $ref: '#/channels/session/messages/rankingRoom' }] }
  sendSessionState: { action: send, channel: { $ref: '#/channels/session' }, summary: 'Full state, filtered per recipient', messages: [{ $ref: '#/channels/session/messages/sessionState' }] }
  sendFacilitatorHandover: { action: send, channel: { $ref: '#/channels/session' }, summary: "New animation token, sent only to the beneficiary's connections", messages: [{ $ref: '#/channels/session/messages/facilitatorHandover' }] }
  sendTick: { action: send, channel: { $ref: '#/channels/session' }, messages: [{ $ref: '#/channels/session/messages/tick' }] }
  sendError: { action: send, channel: { $ref: '#/channels/session' }, messages: [{ $ref: '#/channels/session/messages/error' }] }

components:
  messages:
    hello: { name: hello, payload: { $ref: '#/components/schemas/hello' } }
    heartbeat: { name: heartbeat, payload: { $ref: '#/components/schemas/heartbeat' } }
    addFeature: { name: addFeature, payload: { $ref: '#/components/schemas/addFeature' } }
    updateFeature: { name: updateFeature, payload: { $ref: '#/components/schemas/updateFeature' } }
    deleteFeature: { name: deleteFeature, payload: { $ref: '#/components/schemas/deleteFeature' } }
    updateSettings: { name: updateSettings, payload: { $ref: '#/components/schemas/updateSettings' } }
    changeStatus: { name: changeStatus, payload: { $ref: '#/components/schemas/changeStatus' } }
    openRound: { name: openRound, payload: { $ref: '#/components/schemas/openRound' } }
    castVote: { name: castVote, payload: { $ref: '#/components/schemas/castVote' } }
    revealRound: { name: revealRound, payload: { $ref: '#/components/schemas/revealRound' } }
    transferFacilitator: { name: transferFacilitator, payload: { $ref: '#/components/schemas/transferFacilitator' } }
    updateRankingDraft: { name: updateRankingDraft, payload: { $ref: '#/components/schemas/updateRankingDraft' } }
    endRanking: { name: endRanking, payload: { $ref: '#/components/schemas/endRanking' } }
    reactToFeature: { name: reactToFeature, payload: { $ref: '#/components/schemas/reactToFeature' } }
    proposeMove: { name: proposeMove, payload: { $ref: '#/components/schemas/proposeMove' } }
    resolveProposal: { name: resolveProposal, payload: { $ref: '#/components/schemas/resolveProposal' } }
    updateHand: { name: updateHand, payload: { $ref: '#/components/schemas/updateHand' } }
    setSpotlight: { name: setSpotlight, payload: { $ref: '#/components/schemas/setSpotlight' } }
    openAgreementPoll: { name: openAgreementPoll, payload: { $ref: '#/components/schemas/openAgreementPoll' } }
    answerAgreementPoll: { name: answerAgreementPoll, payload: { $ref: '#/components/schemas/answerAgreementPoll' } }
    rankingRoom: { name: rankingRoom, payload: { $ref: '#/components/schemas/rankingRoom' } }
    sessionState: { name: sessionState, payload: { $ref: '#/components/schemas/sessionState' } }
    facilitatorHandover: { name: facilitatorHandover, payload: { $ref: '#/components/schemas/facilitatorHandover' } }
    tick: { name: tick, payload: { $ref: '#/components/schemas/tick' } }
    error: { name: error, payload: { $ref: '#/components/schemas/error' } }

  schemas:
    criterionKey:
      type: string
      pattern: '^[a-z][a-zA-Z0-9]{0,19}$'
      description: A key declared in methodDefinition.criteria (WSJF - bv, tc, rrOe, js)
    criteria:
      type: object
      description: |
        Values by criterion key of the session's method (FR-017b). A missing key or null means
        "not entered" ("no opinion" in a vote, FR-019). Unknown keys get `error UNKNOWN_CRITERION`.
      propertyNames: { $ref: '#/components/schemas/criterionKey' }
      additionalProperties: { type: [integer, 'null'], minimum: 1 }
      examples: [{ bv: 8, tc: 5, rrOe: 3, js: 4 }]
    exactValue:
      type: object
      description: Exact fraction (integers have denominator 1), plus its display per the definition
      required: [numerator, denominator, display]
      properties:
        numerator: { type: integer }
        denominator: { type: integer, minimum: 1 }
        display: { type: string, examples: ['16', '4,00'] }
    methodDefinition:
      type: object
      description: Single source of the method's fields, labels and help texts (FR-016a, FR-017a)
      required: [key, version, name, criteria, computedValues, formula, tieBreakRule]
      properties:
        key: { type: string, examples: [WSJF] }
        version: { type: integer, minimum: 1 }
        name: { type: string, examples: [WSJF] }
        criteria:
          type: array
          minItems: 1
          description: Entered criteria, in display order
          items:
            type: object
            required: [key, code, label, definition, header]
            properties:
              key: { $ref: '#/components/schemas/criterionKey' }
              code: { type: string, examples: [BV] }
              label: { type: string, examples: [Business Value] }
              definition: { type: string, examples: ['Valeur apportée aux utilisateurs ou au business.'] }
              header: { type: string, description: Column header for import and export, examples: [BV] }
        computedValues:
          type: array
          description: Computed values, in display order
          items:
            type: object
            required: [key, code, label, definition, header, display]
            properties:
              key: { type: string, examples: [wsjf] }
              code: { type: string, examples: [WSJF] }
              label: { type: string, examples: [Weighted Shortest Job First] }
              definition: { type: string }
              header: { type: string, examples: [WSJF] }
              display: { type: string, enum: [INTEGER, DECIMAL_2] }
        formula: { type: string, examples: ['CoD = BV + TC + RR/OE ; WSJF = CoD / JS'] }
        tieBreakRule: { type: string }
    hello:
      type: object
      required: [type, participantToken]
      properties:
        type: { const: hello }
        participantToken: { type: string }
        animationToken: { type: string }
    heartbeat:
      type: object
      required: [type]
      properties:
        type: { const: heartbeat }
    addFeature:
      type: object
      required: [type, externalId, title]
      properties:
        type: { const: addFeature }
        externalId: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        criteria: { $ref: '#/components/schemas/criteria' }
    updateFeature:
      type: object
      required: [type, featureId, version]
      properties:
        type: { const: updateFeature }
        featureId: { type: string, format: uuid }
        version: { type: integer }
        externalId: { type: string, minLength: 1, maxLength: 50 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        criteria:
          description: Only the keys present are changed; null clears a value
          $ref: '#/components/schemas/criteria'
        markedForReview: { type: boolean, description: 'Facilitator reminder (FR-006a); allowed even while the feature is in an open round' }
        reviewReason: { type: [string, 'null'], maxLength: 200 }
    deleteFeature:
      type: object
      required: [type, featureId, version]
      properties:
        type: { const: deleteFeature }
        featureId: { type: string, format: uuid }
        version: { type: integer }
    updateSettings:
      type: object
      required: [type]
      properties:
        type: { const: updateSettings }
        name: { type: string, minLength: 1, maxLength: 120 }
        scale:
          type: object
          required: [type, max]
          properties:
            type: { type: string, enum: [CONTINUOUS, FIBONACCI] }
            max: { type: integer }
        confirm:
          type: boolean
          default: false
          description: Without it, a scale change that puts values out of scale gets `error SCALE_IMPACT`
    changeStatus:
      type: object
      required: [type, action]
      properties:
        type: { const: changeStatus }
        action: { type: string, enum: [START, CLOSE, REOPEN] }
    openRound:
      type: object
      required: [type, criterionKeys, featureIds]
      description: Revised 2026-10-15 - a round covers a selection of criteria and features, chosen like in the ranking screen (FR-018)
      properties:
        type: { const: openRound }
        criterionKeys:
          type: array
          minItems: 1
          uniqueItems: true
          description: Criteria of the session method evaluated in the round; unknown keys get `error UNKNOWN_CRITERION`
          items: { $ref: '#/components/schemas/criterionKey' }
        featureIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        previousRoundId: { type: [string, 'null'], format: uuid }
    castVote:
      type: object
      required: [type, roundId, votes]
      description: >-
        Revised 2026-10-15 - the member's whole ranking for the round, sent once with
        "Envoyer mon vote" (FR-019); it replaces any previous one until the round is revealed.
      properties:
        type: { const: castVote }
        roundId: { type: string, format: uuid }
        votes:
          type: object
          description: >-
            By featureId, one entry per feature of the round; criteria limited to the round's
            criteria; a missing or null key means "no opinion" (feature left unranked, FR-019)
          additionalProperties: { $ref: '#/components/schemas/criteria' }
    revealRound:
      type: object
      required: [type, roundId]
      properties:
        type: { const: revealRound }
        roundId: { type: string, format: uuid }
    transferFacilitator:
      type: object
      required: [type, toParticipantId]
      properties:
        type: { const: transferFacilitator }
        toParticipantId: { type: string, format: uuid }
    facilitatorHandover:
      type: object
      required: [type, animationToken]
      properties:
        type: { const: facilitatorHandover }
        animationToken: { type: string }
    tick:
      type: object
      required: [type]
      properties:
        type: { const: tick }
    rankingDraft:
      type: object
      description: >-
        Snapshot of the facilitator's ranking screen (FR-015a steps 2 to 4), never stored.
        Features in an open round get `error FEATURE_IN_OPEN_ROUND`; a value outside the scale
        gets `error INVALID_VALUE`; a feature listed twice gets `error INVALID_MESSAGE`.
      required: [criterionKeys, criterionKey, levels, unranked, values]
      properties:
        criterionKeys:
          type: array
          minItems: 1
          uniqueItems: true
          description: Criteria chosen at step 1, in method definition order
          items: { $ref: '#/components/schemas/criterionKey' }
        criterionKey:
          description: Criterion being ranked, one of criterionKeys
          $ref: '#/components/schemas/criterionKey'
        levels:
          type: array
          description: From the highest to the lowest level; features of a level are tied
          items:
            type: array
            minItems: 1
            items: { type: string, format: uuid }
        unranked:
          type: array
          description: Features waiting in "Non classées (sans valeur)"
          items: { type: string, format: uuid }
        values:
          type: object
          description: Value of each ranked feature for criterionKey, by featureId; null or missing means no value
          additionalProperties: { type: [integer, 'null'], minimum: 1 }
    updateRankingDraft:
      type: object
      required: [type, live]
      description: >-
        Facilitator only (`error FORBIDDEN` otherwise; `error SESSION_CLOSED` in CLOSED). The
        first one opens the room. With `live: true`, `draft` is required and replaces the
        broadcast draft. With `live: false`, the broadcast is paused: `draft` is ignored and
        members keep the last broadcast one (FR-015b).
      properties:
        type: { const: updateRankingDraft }
        live: { type: boolean }
        draft: { $ref: '#/components/schemas/rankingDraft' }
    endRanking:
      type: object
      required: [type, outcome]
      properties:
        type: { const: endRanking }
        outcome:
          type: string
          enum: [SAVED, CANCELLED]
          description: SAVED once every updateFeature sent by "Terminer" is confirmed; CANCELLED on "Annuler"
    reactionKind:
      type: string
      enum: [AGREE, RAISE, LOWER, QUESTION]
      description: "D'accord, Je monterais, Je descendrais, J'ai une question (FR-015c point 1)"
    reactToFeature:
      type: object
      required: [type, featureId, criterionKey, reaction, active]
      description: >-
        Participant only. At most one of AGREE, RAISE and LOWER per member, feature and
        criterion: activating one removes the other two. QUESTION is independent.
      properties:
        type: { const: reactToFeature }
        featureId: { type: string, format: uuid }
        criterionKey: { $ref: '#/components/schemas/criterionKey' }
        reaction: { $ref: '#/components/schemas/reactionKind' }
        active: { type: boolean, description: true adds the reaction, false removes it }
    movePosition:
      type: string
      enum: [ABOVE, TIE, BELOW]
      description: "au-dessus de, au même niveau que, en dessous de"
    proposeMove:
      type: object
      required: [type, featureId, criterionKey, position, referenceFeatureId]
      description: >-
        Participant only. Both features must be in the draft and differ, the reference
        feature must be ranked, and criterionKey must be the draft's current criterion;
        otherwise `error NOT_IN_RANKING`.
      properties:
        type: { const: proposeMove }
        featureId: { type: string, format: uuid }
        criterionKey: { $ref: '#/components/schemas/criterionKey' }
        position: { $ref: '#/components/schemas/movePosition' }
        referenceFeatureId: { type: string, format: uuid }
        reason: { type: [string, 'null'], maxLength: 140 }
    resolveProposal:
      type: object
      required: [type, proposalId, decision]
      description: >-
        Facilitator only, on a PENDING proposal. APPLY marks it applied: the facilitator's
        client moves the feature with the FR-015a rules and sends the new draft. DISCUSS puts
        the feature under discussion for 120 s and gives the floor to the author. DISMISS
        drops it.
      properties:
        type: { const: resolveProposal }
        proposalId: { type: string, format: uuid }
        decision: { type: string, enum: [APPLY, DISCUSS, DISMISS] }
    updateHand:
      type: object
      required: [type, action]
      description: >-
        A participant may RAISE or LOWER their own hand (participantId omitted). The
        facilitator may LOWER anyone's hand, GIVE_FLOOR to a member (which lowers their hand)
        and END_FLOOR (participantId omitted). Anything else gets `error FORBIDDEN`; an
        unknown member gets `error UNKNOWN_PARTICIPANT`.
      properties:
        type: { const: updateHand }
        action: { type: string, enum: [RAISE, LOWER, GIVE_FLOOR, END_FLOOR] }
        participantId: { type: string, format: uuid }
    setSpotlight:
      type: object
      required: [type, action]
      description: >-
        Facilitator only. START puts featureId under discussion for `seconds` (default 120)
        and ends the previous one; EXTEND adds `seconds` (default 60) to the current one;
        END ends it and the floor with it. The timer is indicative: nothing is blocked at zero.
      properties:
        type: { const: setSpotlight }
        action: { type: string, enum: [START, EXTEND, END] }
        featureId: { type: string, format: uuid, description: Required for START }
        seconds: { type: integer, minimum: 10, maximum: 600 }
    openAgreementPoll:
      type: object
      required: [type, criterionKey]
      description: Facilitator only. Replaces the poll in progress, if any.
      properties:
        type: { const: openAgreementPoll }
        criterionKey: { $ref: '#/components/schemas/criterionKey' }
    answerAgreementPoll:
      type: object
      required: [type, pollId, answer]
      description: Participant only; a new answer replaces the previous one.
      properties:
        type: { const: answerAgreementPoll }
        pollId: { type: string, format: uuid }
        answer: { type: string, enum: [AGREE, RESERVED, DISAGREE] }
    rankingRoom:
      type: object
      required: [type, active]
      description: >-
        Live ranking room (FR-015b, FR-015c), filtered per recipient: `proposals` holds every
        PENDING proposal for the facilitator and the recipient's own recent proposals (any
        status) for a participant; `poll.counts` is null except for the facilitator. When
        `active` is false, only `endReason` is set, and the client goes back to the board.
      properties:
        type: { const: rankingRoom }
        active: { type: boolean }
        endReason:
          type: [string, 'null']
          enum: [SAVED, CANCELLED, FACILITATOR_LEFT, FACILITATOR_CHANGED, SESSION_CLOSED, null]
        facilitatorId: { type: string, format: uuid }
        live: { type: boolean, description: False while the facilitator paused the broadcast }
        draft: { $ref: '#/components/schemas/rankingDraft' }
        reactions:
          type: array
          description: Reactions of the current criterion and the other chosen criteria
          items:
            type: object
            required: [featureId, criterionKey, reaction, participantIds]
            properties:
              featureId: { type: string, format: uuid }
              criterionKey: { $ref: '#/components/schemas/criterionKey' }
              reaction: { $ref: '#/components/schemas/reactionKind' }
              participantIds:
                type: array
                minItems: 1
                items: { type: string, format: uuid }
        spotlight:
          type: [object, 'null']
          required: [featureId, remainingSeconds]
          properties:
            featureId: { type: string, format: uuid }
            remainingSeconds: { type: integer, minimum: 0, description: At send time; the client counts down locally }
        speakerId: { type: [string, 'null'], format: uuid, description: Member who has the floor }
        hands:
          type: array
          description: Raised hands, oldest first
          items:
            type: object
            required: [participantId, waitingSeconds]
            properties:
              participantId: { type: string, format: uuid }
              waitingSeconds: { type: integer, minimum: 0 }
        proposals:
          type: array
          items:
            type: object
            required: [id, participantId, featureId, criterionKey, position, referenceFeatureId, status]
            properties:
              id: { type: string, format: uuid }
              participantId: { type: string, format: uuid }
              featureId: { type: string, format: uuid }
              criterionKey: { $ref: '#/components/schemas/criterionKey' }
              position: { $ref: '#/components/schemas/movePosition' }
              referenceFeatureId: { type: string, format: uuid }
              reason: { type: [string, 'null'] }
              status:
                type: string
                enum: [PENDING, APPLIED, DISCUSSED, DISMISSED, OBSOLETE]
                description: OBSOLETE when a feature of the proposal left the ranking
        poll:
          type: [object, 'null']
          required: [id, criterionKey, answered, myAnswer]
          properties:
            id: { type: string, format: uuid }
            criterionKey: { $ref: '#/components/schemas/criterionKey' }
            answered: { type: integer, minimum: 0, description: Number of members who answered }
            myAnswer: { type: [string, 'null'], enum: [AGREE, RESERVED, DISAGREE, null] }
            counts:
              type: [object, 'null']
              description: Facilitator only, without pseudos (FR-015c point 5)
              required: [agree, reserved, disagree]
              properties:
                agree: { type: integer, minimum: 0 }
                reserved: { type: integer, minimum: 0 }
                disagree: { type: integer, minimum: 0 }
        feed:
          type: array
          maxItems: 30
          description: Latest events, newest first; the front writes the sentence (FR-015c point 6)
          items:
            type: object
            required: [at, participantId, kind]
            properties:
              at: { type: string, format: date-time }
              participantId: { type: string, format: uuid }
              kind:
                type: string
                enum: [REACTED, PROPOSED, PROPOSAL_APPLIED, PROPOSAL_DISCUSSED, PROPOSAL_DISMISSED,
                       HAND_RAISED, FLOOR_GIVEN, SPOTLIGHT_STARTED, POLL_OPENED]
              featureId: { type: [string, 'null'], format: uuid }
              criterionKey:
                oneOf:
                  - $ref: '#/components/schemas/criterionKey'
                  - type: 'null'
              reaction:
                oneOf:
                  - $ref: '#/components/schemas/reactionKind'
                  - type: 'null'
    error:
      type: object
      required: [type, code]
      properties:
        type: { const: error }
        code:
          type: string
          enum: [INVALID_MESSAGE, FORBIDDEN, SESSION_CLOSED, STALE_VERSION, INVALID_VALUE,
                 DUPLICATE_EXTERNAL_ID, FEATURE_IN_OPEN_ROUND, ROUND_REVEALED, SCALE_IMPACT,
                 UNKNOWN_PARTICIPANT, SESSION_NOT_STARTED, ROUND_OPEN, PARTICIPANT_OFFLINE,
                 UNKNOWN_CRITERION, SESSION_NAME_TAKEN, NO_RANKING_IN_PROGRESS, NOT_IN_RANKING]
        featureId: { type: string, format: uuid }
        impactedValues:
          type: array
          items:
            type: object
            required: [externalId, criterion, value]
            properties:
              externalId: { type: string }
              criterion: { $ref: '#/components/schemas/criterionKey' }
              value: { type: integer }
    score:
      type: object
      description: Computed by the domain only, never entered
      required: [complete, outOfScale]
      properties:
        complete: { type: boolean }
        outOfScale:
          type: array
          items: { $ref: '#/components/schemas/criterionKey' }
        computed:
          type: [object, 'null']
          description: By key of methodDefinition.computedValues; null when not complete
          additionalProperties: { $ref: '#/components/schemas/exactValue' }
          examples:
            - cod: { numerator: 16, denominator: 1, display: '16' }
              wsjf: { numerator: 4, denominator: 1, display: '4,00' }
        explanation:
          type: [string, 'null']
          examples: ['CoD = 8 + 5 + 3 = 16 ; WSJF = 16 / 4 = 4,00']
        rank: { type: [integer, 'null'] }
    feature:
      type: object
      required: [id, externalId, title, version, votingInProgress, criteria, score]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        version: { type: integer }
        markedForReview: { type: boolean }
        reviewReason: { type: [string, 'null'] }
        votingInProgress:
          type: boolean
          description: When true and the recipient is not the facilitator, criteria and score are null (FR-019a)
        criteria:
          oneOf:
            - $ref: '#/components/schemas/criteria'
            - type: 'null'
        score:
          oneOf:
            - $ref: '#/components/schemas/score'
            - type: 'null'
    round:
      type: object
      required: [id, number, status, criterionKeys, featureIds, progress]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { type: string, enum: [OPEN, REVEALED] }
        criterionKeys:
          type: array
          description: Criteria evaluated in the round, in method definition order (FR-018)
          items: { $ref: '#/components/schemas/criterionKey' }
        featureIds:
          type: array
          items: { type: string, format: uuid }
        progress:
          type: array
          description: Always visible - whether each member has sent their vote (FR-019)
          items:
            type: object
            required: [participantId, voted]
            properties:
              participantId: { type: string, format: uuid }
              voted: { type: boolean, description: 'True once the member has sent their ranking ("Envoyer mon vote")' }
        myVotes:
          type: object
          description: Recipient's own votes, by featureId (only ones visible while OPEN)
          additionalProperties: { $ref: '#/components/schemas/criteria' }
        results:
          type: [array, 'null']
          description: Always null while OPEN (SC-004)
          items:
            type: object
            required: [featureId, votes, min, max]
            properties:
              featureId: { type: string, format: uuid }
              votes:
                type: array
                items:
                  type: object
                  required: [participantId, voted, criteria]
                  properties:
                    criteria: { $ref: '#/components/schemas/criteria' }
                    participantId: { type: string, format: uuid }
                    voted: { type: boolean, description: 'True when the member sent a vote; a null criterion means "no opinion" (FR-019)' }
              min:
                description: Over entered values only; null for a criterion nobody entered (FR-020)
                $ref: '#/components/schemas/criteria'
              max:
                description: Over entered values only; null for a criterion nobody entered (FR-020)
                $ref: '#/components/schemas/criteria'
              largeSpread:
                type: array
                description: Criteria where max - min > 3 (FR-020)
                items: { $ref: '#/components/schemas/criterionKey' }
              unanimous:
                description: Value per criterion when everyone who entered a value for it entered the same one, else null (also null when nobody entered one); prefills consensus (FR-021)
                $ref: '#/components/schemas/criteria'
    sessionState:
      type: object
      required: [type, version, sessionId, name, status, method, methodVersion, methodDefinition,
                 formula, tieBreakRule, scale, me, participants, features, openRounds]
      properties:
        type: { const: sessionState }
        version: { type: integer, description: Increases on every accepted change }
        sessionId: { type: string }
        name: { type: string }
        status: { type: string, enum: [PREPARATION, IN_PROGRESS, CLOSED] }
        method: { type: string, examples: [WSJF], description: 'Key of the session method (FR-017); WSJF only in V1' }
        methodVersion: { type: integer }
        methodDefinition:
          description: The front builds columns, inputs, help and round grids from it (FR-017b)
          $ref: '#/components/schemas/methodDefinition'
        formula: { type: string, description: Same as methodDefinition.formula, examples: ['CoD = BV + TC + RR/OE ; WSJF = CoD / JS'] }
        tieBreakRule: { type: string, description: Same as methodDefinition.tieBreakRule }
        scale:
          type: object
          required: [type, max, allowedValues]
          properties:
            type: { type: string, enum: [CONTINUOUS, FIBONACCI] }
            max: { type: integer }
            allowedValues:
              type: array
              items: { type: integer }
        me:
          type: object
          required: [participantId, pseudo, role]
          properties:
            participantId: { type: string, format: uuid }
            pseudo: { type: string }
            role: { type: string, enum: [FACILITATOR, PARTICIPANT] }
        participants:
          type: array
          items:
            type: object
            required: [participantId, pseudo, role, online]
            properties:
              participantId: { type: string, format: uuid }
              pseudo: { type: string }
              role: { type: string, enum: [FACILITATOR, PARTICIPANT] }
              businessRole: { type: [string, 'null'] }
              online: { type: boolean }
        features:
          type: array
          description: Sorted per FR-014; features in an open round are last for non-facilitators
          items: { $ref: '#/components/schemas/feature' }
        openRounds:
          type: array
          description: At most one round in V1 (one open round per session, FR-018)
          maxItems: 1
          items: { $ref: '#/components/schemas/round' }
        lastRevealedRounds:
          type: array
          description: Most recent revealed round of each feature, for the consensus step
          items: { $ref: '#/components/schemas/round' }
        revealedRounds:
          type: array
          description: All revealed rounds, newest first, with their results (FR-022, US5 consultation)
          items: { $ref: '#/components/schemas/round' }
