asyncapi: 3.1.0
info:
  title: Priorisation Epic - session WebSocket
  version: 1.0.0
  description: |
    The **only** channel for live session actions, aligned with planning-poker (AD-2): raw
    WebSocket carrying JSON text frames, no STOMP, no SockJS. Every message is an object whose
    `type` property names it. Operations are written from the webservice's point of view: it
    **receives** the client's intents and **sends** its own messages.

    - An intent already satisfied changes nothing and raises no error; `sessionState` is still
      sent, unchanged, so the sender knows its intent was handled.
    - An intent the webservice fails to process (unexpected failure) changes nothing and gets
      `error INVALID_MESSAGE` back, so the client stops waiting.
    - A forbidden intent changes nothing and gets `error` back.
    - Intents that write a feature carry the feature `version` they read; a mismatch changes
      nothing and gets `error STALE_VERSION` (constitution III: no silent overwrite).
    - The contract never lists the criteria of a method (FR-017a, FR-017b): criteria and computed
      values are maps keyed by the keys that `sessionState.methodDefinition` declares.
    - The contract only evolves by addition. The messages of the user journeys are added to this
      file with their schemas, task by task.
    - Exception, the live ranking room (FR-015b, FR-015c): `updateRankingDraft`, `endRanking`,
      `giveOpinion`, `clearOpinions`, `setSpotlight` and `settleCard` write nothing to the database, do not
      increment `version` and do not trigger `sessionState`. After each accepted one, every
      connection of the session gets `rankingRoom`. The room lives in memory, one per session,
      from the first `updateRankingDraft` to its end; a server restart only ends it. Opinions and
      the card under discussion are never stored, exported nor written to the change log.
  license:
    name: Proprietary

defaultContentType: application/json

servers:
  local:
    host: localhost:8080
    protocol: ws
    description: Local development. Deployed URLs come from `apiBaseUrl` in the front's `/config.json`.

channels:
  session:
    address: /ws/sessions/{sessionId}
    title: Session channel
    description: |
      Handshake:
      1. the client opens `/ws/sessions/{sessionId}`; tokens are **never** in the URL;
      2. its first message must be `hello`, within 5 s (otherwise close `1008`);
      3. the server checks the session (close `4404` if unknown), then the participant token
         (close `4401` if unknown), then the optional animation token (if present and invalid,
         the connection is accepted as a plain participant and gets `error FORBIDDEN`);
      4. then it sends `sessionState`.

      Liveness: protocol ping every 5 s, close after 15 s without pong nor message; server `tick`
      every 5 s; client `heartbeat` every 5 s; the client declares the connection lost after 12 s
      of silence and reconnects immediately, then after 1, 2, 4, 8 s, then every 10 s. On `4401`
      or `4404` it does not reconnect. Incoming messages are limited to 16 KB (close `1009`).
    parameters:
      sessionId:
        description: 128 random bits, base64url without padding (22 characters).
    messages:
      hello:
        $ref: '#/components/messages/hello'
      heartbeat:
        $ref: '#/components/messages/heartbeat'
      tick:
        $ref: '#/components/messages/tick'
      error:
        $ref: '#/components/messages/error'
      addFeature:
        $ref: '#/components/messages/addFeature'
      updateFeature:
        $ref: '#/components/messages/updateFeature'
      deleteFeature:
        $ref: '#/components/messages/deleteFeature'
      updateSettings:
        $ref: '#/components/messages/updateSettings'
      changeStatus:
        $ref: '#/components/messages/changeStatus'
      sessionState:
        $ref: '#/components/messages/sessionState'
      updateRankingDraft:
        $ref: '#/components/messages/updateRankingDraft'
      endRanking:
        $ref: '#/components/messages/endRanking'
      giveOpinion:
        $ref: '#/components/messages/giveOpinion'
      clearOpinions:
        $ref: '#/components/messages/clearOpinions'
      setSpotlight:
        $ref: '#/components/messages/setSpotlight'
      settleCard:
        $ref: '#/components/messages/settleCard'
      rankingRoom:
        $ref: '#/components/messages/rankingRoom'
    x-close-codes:
      - code: 4401
        reason: Unknown participant token. The client shows the Join screen.
      - code: 4404
        reason: Unknown session. The client shows the "session not found" screen.
      - code: 1008
        reason: First message is not a valid hello, or hello did not arrive within 5 s.
      - code: 1009
        reason: Incoming message larger than the limit (16 KB). The client reconnects.

operations:
  receiveHello:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Open the conversation with the participant token (and the animation token for the facilitator).
    messages:
      - $ref: '#/channels/session/messages/hello'
  receiveHeartbeat:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Client sign of life, every 5 s.
    messages:
      - $ref: '#/channels/session/messages/heartbeat'
  receiveAddFeature:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Add a feature (FR-006), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/addFeature'
  receiveUpdateFeature:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Edit a feature and its retained values (FR-006, FR-015), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/updateFeature'
  receiveDeleteFeature:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Soft-delete a feature, facilitator only.
    messages:
      - $ref: '#/channels/session/messages/deleteFeature'
  receiveUpdateSettings:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Rename the session or change its scale (FR-010, FR-011), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/updateSettings'
  receiveChangeStatus:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Start, close or reopen the session (FR-004, FR-026), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/changeStatus'
  receiveUpdateRankingDraft:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Open the ranking room, broadcast the ranking draft or pause the broadcast (FR-015b), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/updateRankingDraft'
  receiveEndRanking:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Close the ranking room, saved or cancelled (FR-015b), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/endRanking'
  receiveGiveOpinion:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Give, change or withdraw an opinion on a card, with an optional comment (FR-015c), participant only.
    messages:
      - $ref: '#/channels/session/messages/giveOpinion'
  receiveClearOpinions:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Clear the opinions of a card for a criterion (FR-015c), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/clearOpinions'
  receiveSetSpotlight:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Start or end the card under discussion (FR-015c), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/setSpotlight'
  receiveSettleCard:
    action: receive
    channel:
      $ref: '#/channels/session'
    summary: Mark a card as agreed for a criterion, or reopen it (FR-015c), facilitator only.
    messages:
      - $ref: '#/channels/session/messages/settleCard'
  sendRankingRoom:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: Live ranking room, the same for every member (FR-015b, FR-015c).
    messages:
      - $ref: '#/channels/session/messages/rankingRoom'
  sendSessionState:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: Full state, filtered for each recipient.
    messages:
      - $ref: '#/channels/session/messages/sessionState'
  sendTick:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: Server sign of life, every 5 s.
    messages:
      - $ref: '#/channels/session/messages/tick'
  sendError:
    action: send
    channel:
      $ref: '#/channels/session'
    summary: An intent was refused or a message was invalid.
    messages:
      - $ref: '#/channels/session/messages/error'

components:
  messages:
    hello:
      name: hello
      title: hello
      summary: Open the conversation with the participant token (and the animation token for the facilitator).
      payload:
        $ref: './schemas/hello.json'
    heartbeat:
      name: heartbeat
      title: heartbeat
      summary: Client sign of life, every 5 s.
      payload:
        $ref: './schemas/heartbeat.json'
    tick:
      name: tick
      title: tick
      summary: Server sign of life, every 5 s.
      payload:
        $ref: './schemas/tick.json'
    error:
      name: error
      title: error
      summary: An intent was refused or a message was invalid.
      payload:
        $ref: './schemas/error.json'
    addFeature:
      name: addFeature
      title: addFeature
      summary: Add a feature (FR-006), facilitator only.
      payload:
        $ref: './schemas/add-feature.json'
    updateFeature:
      name: updateFeature
      title: updateFeature
      summary: Edit a feature and its retained values (FR-006, FR-015), facilitator only.
      payload:
        $ref: './schemas/update-feature.json'
    deleteFeature:
      name: deleteFeature
      title: deleteFeature
      summary: Soft-delete a feature, facilitator only.
      payload:
        $ref: './schemas/delete-feature.json'
    updateSettings:
      name: updateSettings
      title: updateSettings
      summary: Rename the session or change its scale (FR-010, FR-011), facilitator only.
      payload:
        $ref: './schemas/update-settings.json'
      description: A new name already used by another session, ignoring case and surrounding spaces, is refused with `error SESSION_NAME_TAKEN` (FR-001a).
    changeStatus:
      name: changeStatus
      title: changeStatus
      summary: Start, close or reopen the session (FR-004, FR-026), facilitator only.
      payload:
        $ref: './schemas/change-status.json'
    sessionState:
      name: sessionState
      title: sessionState
      summary: Full state, filtered for each recipient (FR-019, FR-019a, SC-004).
      payload:
        $ref: './schemas/session-state.json'
    updateRankingDraft:
      name: updateRankingDraft
      title: updateRankingDraft
      summary: Open the ranking room, broadcast the ranking draft or pause the broadcast (FR-015b), facilitator only.
      payload:
        $ref: './schemas/update-ranking-draft.json'
    endRanking:
      name: endRanking
      title: endRanking
      summary: Close the ranking room, saved or cancelled (FR-015b), facilitator only.
      payload:
        $ref: './schemas/end-ranking.json'
    giveOpinion:
      name: giveOpinion
      title: giveOpinion
      summary: Give, change or withdraw an opinion on a card, with an optional comment (FR-015c), participant only.
      payload:
        $ref: './schemas/give-opinion.json'
    clearOpinions:
      name: clearOpinions
      title: clearOpinions
      summary: Clear the opinions of a card for a criterion (FR-015c), facilitator only.
      payload:
        $ref: './schemas/clear-opinions.json'
    setSpotlight:
      name: setSpotlight
      title: setSpotlight
      summary: Start or end the card under discussion (FR-015c), facilitator only.
      payload:
        $ref: './schemas/set-spotlight.json'
    settleCard:
      name: settleCard
      title: settleCard
      summary: Mark a card as agreed for a criterion, or reopen it (FR-015c), facilitator only.
      payload:
        $ref: './schemas/settle-card.json'
    rankingRoom:
      name: rankingRoom
      title: rankingRoom
      summary: Live ranking room, the same for every member (FR-015b, FR-015c).
      payload:
        $ref: './schemas/ranking-room.json'
