openapi: 3.2.0
info:
  title: Priorisation Epic - REST API
  version: 1.0.0
  description: |
    REST surface of the webservice, aligned with planning-poker (AD-2): REST covers only entry
    (create, join, list), files (import, export, template) and health. **Every live session
    action goes through the WebSocket** described in `asyncapi.yaml`.

    - Errors are `application/problem+json` (RFC 9457) with a French `detail` (FR-027).
    - Tokens never appear in URLs. REST calls that need one send `X-Participant-Token` and, for
      facilitator-only actions, `X-Animation-Token`.
    - The contract only evolves by addition. The operations of the user journeys are added to
      this file with their schemas, task by task.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8080
    description: Local development. Deployed URLs come from `apiBaseUrl` in the front's `/config.json`.

security: []

tags:
  - name: health
    description: Wake-up probe.
  - name: sessions
    description: Create a session, join it, read it.
  - name: methods
    description: Prioritization methods offered at creation.
  - name: imports
    description: Import features from Excel, CSV or JSON, with a preview (FR-007, FR-008).
  - name: exports
    description: Export the board (CSV, Confluence) or the whole session (JSON) (FR-023, FR-024).

paths:
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Wake-up and health probe
      description: Answers 200 as soon as the webservice is ready. Used by Render as health check and polled by the front during a cold start.
      responses:
        '200':
          description: The webservice is ready.
          content:
            application/json:
              schema:
                $ref: './schemas/health-response.json'

  /api/methods:
    get:
      tags: [methods]
      operationId: listMethods
      summary: Methods offered at session creation, each in its latest version (FR-017c, FR-017d)
      description: WSJF only in V1. Used by the creation form and its "method detail" panel.
      responses:
        '200':
          description: The methods, each with its full definition.
          content:
            application/json:
              schema:
                $ref: './schemas/method-list.json'

  /api/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List all sessions, newest first (FR-026)
      description: Open to anyone with access to the tool, without token. Each line gives the name, the current facilitator, the creation date, the status and the method of a session. A closed session is then read with `GET /api/sessions/{sessionId}`.
      responses:
        '200':
          description: All sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/session-summary.json'
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create a session; the creator becomes facilitator (FR-001, FR-002)
      description: The session gets the requested method (WSJF by default) in its latest version, frozen for the session (FR-017). An unknown method is refused with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/create-session-request.json'
      responses:
        '201':
          description: Created. Only the hashes of the two tokens are kept by the server.
          content:
            application/json:
              schema:
                $ref: './schemas/create-session-response.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: Read-only view of a session (FR-026)
      description: Returns the same payload as the WebSocket `sessionState`, filtered as for a non-facilitator participant with no votes of its own (`me` is null). Used to show the session name on the join screen, and to read a closed session from the session list without joining it (FR-026).
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: './schemas/session-state.json'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /api/sessions/{sessionId}/participants:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      tags: [sessions]
      operationId: joinSession
      summary: Join with a pseudo (FR-002, FR-003); returns the participant token used in hello
      description: A pseudo already used is refused with 409, unless its owner has been absent for 10 minutes or more; the newcomer is then attached to that participant, with its votes. The facilitator role is never taken back this way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/join-session-request.json'
      responses:
        '201':
          description: Joined.
          content:
            application/json:
              schema:
                $ref: './schemas/join-session-response.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/PseudoTaken'

  /api/sessions/{sessionId}/imports:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    post:
      tags: [imports]
      operationId: previewImport
      summary: Read a file and return a preview; nothing is written (FR-007, FR-008) - facilitator
      description: |
        Accepts `.xlsx`, `.csv` and `.json` (an export of the tool), 5 MB and 1,000 data rows at most.
        Columns come from the method definition of the session (file-formats.md). A file without
        the `Identifiant` or `Titre` column, unreadable, empty, or (JSON) produced with another
        method is refused whole with 400 and a French message. The preview is kept 15 minutes.
      security:
        - participantToken: []
          animationToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: .xlsx, .csv or .json; 5 MB max.
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema:
                $ref: './schemas/import-preview.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/sessions/{sessionId}/imports/{previewId}/confirm:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - name: previewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [imports]
      operationId: confirmImport
      summary: Import the valid rows in a single transaction, then broadcast sessionState - facilitator
      description: The preview is used once. A row whose identifier was taken since the preview is counted as rejected. A closed session refuses with 403.
      security:
        - participantToken: []
          animationToken: []
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: './schemas/import-result.json'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ImportPreviewNotFound'

  /api/import-template.xlsx:
    get:
      tags: [imports]
      operationId: getImportTemplate
      summary: Download the blank Excel template (FR-007a)
      description: Sheet « Fonctionnalités » with the headers `Identifiant`, `Titre`, `Description`, then the `header` of each criterion of the method, and an example row. Headers are generated from the method definition (FR-017b). An unknown method gets 400.
      parameters:
        - name: method
          in: query
          required: false
          schema:
            type: string
            default: WSJF
        - name: methodVersion
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: The template.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/sessions/{sessionId}/exports/{format}:
    parameters:
      - $ref: '#/components/parameters/sessionId'
      - name: format
        in: path
        required: true
        description: |
          `csv` (board, `tableau-v1`), `confluence-wiki` and `confluence-html` (`confluence-v1`),
          `json` (whole session, `formatVersion: 1`). `csv-votes` comes with masked voting.
        schema:
          type: string
          enum: [csv, confluence-wiki, confluence-html, json]
    get:
      tags: [exports]
      operationId: exportSession
      summary: Export the board or the whole session (FR-023, FR-024)
      description: |
        Open to every member, without a token: the export is built from the same view as
        `getSession`, so features come in board order. The file is sent as an attachment whose
        name carries the format version (`<session>-tableau-v1.csv`, `<session>-confluence-v1.txt`,
        `<session>-confluence-v1.html`, `<session>-session-v1.json`). Columns come from the method
        definition of the session. Formats are described in file-formats.md. An unknown format
        gets 400.
      responses:
        '200':
          description: 'The file, with `Content-Disposition: attachment` and `Cache-Control: no-store`.'
          headers:
            Content-Disposition:
              description: '`attachment` with the versioned file name.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                description: UTF-8 with BOM, `;` separator, RFC 4180 quotes (`tableau-v1`).
            text/plain:
              schema:
                type: string
                description: Confluence wiki markup (`confluence-v1`).
            text/html:
              schema:
                type: string
                description: HTML fragment with a title, a legend and a `<table>` (`confluence-v1`).
            application/json:
              schema:
                type: object
                description: Whole session, `formatVersion` 1 (file-formats.md).
                required: [formatVersion, exportedAt, session, features, rounds]
                properties:
                  formatVersion:
                    const: 1
                  exportedAt:
                    type: string
                    format: date-time
                  session:
                    type: object
                  features:
                    type: array
                    items:
                      type: object
                  rounds:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'

components:
  securitySchemes:
    participantToken:
      type: apiKey
      in: header
      name: X-Participant-Token
    animationToken:
      type: apiKey
      in: header
      name: X-Animation-Token
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      description: 128 random bits, base64url without padding (22 characters).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{22}$'
  responses:
    BadRequest:
      description: Invalid request (French message).
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
    SessionNotFound:
      description: Unknown session.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
    Forbidden:
      description: Facilitator-only action, or session closed.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
    ImportPreviewNotFound:
      description: Unknown or expired import preview (15 minutes), or unknown session.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
    PseudoTaken:
      description: Pseudo already used in this session.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
    PayloadTooLarge:
      description: Request body above the limit (5 MB for imports, small elsewhere).
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
    TooManyRequests:
      description: Too many session creations from the same address.
      content:
        application/problem+json:
          schema:
            $ref: './schemas/problem.json'
