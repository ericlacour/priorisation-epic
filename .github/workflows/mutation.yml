# Tests de mutation PIT sur le domaine (constitution II, research R14) : chaque lundi, à la demande
# et sur les pull requests qui modifient le domaine. Le build échoue sous 80 % de mutants tués. Un
# mutant survivant se corrige par un test, jamais par une exclusion. Le rapport HTML est publié en
# artefact.
name: Mutation

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/main/java/com/priorisationepic/domain/**'
      - 'backend/src/test/java/com/priorisationepic/domain/**'
      - 'backend/pom.xml'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Le domaine est en Java pur : le profil ne lance que ses tests, sans base ni Docker.
      - run: ./mvnw -B -Pmutation verify
      - name: Rapport PIT
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pit-report
          path: backend/target/pit-reports/
          retention-days: 14
