# Vérifie les workflows GitHub Actions : syntaxe, expressions, permissions et scripts
# shell (shellcheck).
name: actionlint

# Pas de filtre de chemins : le contrôle doit exister sur chaque PR pour pouvoir être
# rendu obligatoire dans la protection de main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
