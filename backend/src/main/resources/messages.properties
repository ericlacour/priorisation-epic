# Catalogue unique des messages d'erreur du back (FR-027) : français, actionnables, sans détail technique.
# Les exemples de contract/examples/problem/ reprennent ces textes (RestErrorHandlerTest les compare).
error.malformed-body=Le corps de la requête est illisible.
error.payload-too-large=La requête dépasse la taille autorisée.
error.too-many-requests=Trop de sessions créées depuis cette adresse. Réessayez dans une minute.
error.session-not-found=Cette session n'existe pas.
error.forbidden=Seul l'animateur peut faire cette action.
error.pseudo-taken=Ce pseudo est déjà utilisé dans cette session.
error.invalid-pseudo=Le pseudo doit contenir entre 1 et 40 caractères.
error.invalid-name=Le nom de la session doit contenir entre 1 et 120 caractères.
error.invalid-business-role=Le rôle métier doit contenir 40 caractères au plus.
error.unknown-method=Cette méthode de priorisation n'existe pas.
error.invalid-scale=L'échelle demandée n'est pas valide : choisissez une borne entre 2 et 100.
