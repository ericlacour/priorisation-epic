spring.application.name=priorisation-epic

# Configuration par variables d'environnement : PORT, DATABASE_URL, ALLOWED_ORIGINS.
server.port=${PORT:8080}
priorisation-epic.allowed-origins=${ALLOWED_ORIGINS:}

# Vivacité des connexions : ping de protocole, seuil de silence, tic du serveur.
priorisation-epic.ping-interval=5s
priorisation-epic.liveness-timeout=15s
priorisation-epic.tick-interval=5s
priorisation-epic.hello-timeout=5s

# Plafonds face aux abus : corps REST (413), import (5 Mo), message WebSocket (fermeture 1009),
# créations de session par adresse sur une fenêtre glissante (429).
priorisation-epic.max-request-body=16KB
priorisation-epic.max-import-body=5MB
priorisation-epic.max-ws-message=16KB
priorisation-epic.max-creations-per-ip=10
priorisation-epic.creation-window=1m

# Erreurs REST en application/problem+json (RFC 9457) ; messages en français dans messages.properties.
spring.mvc.problemdetails.enabled=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Journaux JSON sur la sortie standard (jamais de jeton ni de vote masqué).
logging.structured.format.console=logstash

server.shutdown=graceful

# Contrat d'abord : aucun champ hors contrat.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Base de données : DATABASE_URL (voir DatabaseUrlConfig) ou SPRING_DATASOURCE_*.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Pool limité (offre gratuite de la base) avec validation des connexions avant usage : la base peut
# fermer une connexion inactive.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
priorisation-epic.absence-timeout=10m

# Secret partagé avec Cloudflare (en-tête X-Proxy-Secret) : sans lui, CF-Connecting-IP est ignoré pour la limite de débit.
priorisation-epic.proxy-secret=${PROXY_SECRET:}
